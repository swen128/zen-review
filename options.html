<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zen Review</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 16px; min-width: 420px; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    label.block { display: block; font-weight: 600; margin-bottom: 4px; }
    textarea { box-sizing: border-box; width: 100%; height: 120px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 6px; }
    fieldset { border: 0; margin: 16px 0; padding: 0; }
    legend { font-weight: 600; padding: 0; margin-bottom: 4px; }
    .hint { color: GrayText; margin: 4px 0 0; }
    .error { color: #cf222e; margin: 4px 0 0; white-space: pre-line; }
    .actions { display: flex; align-items: center; gap: 12px; }
    button { padding: 4px 14px; font: inherit; }
  </style>
</head>
<body>
  <label class="block" for="patterns">File path patterns</label>
  <textarea id="patterns" spellcheck="false"></textarea>
  <p class="hint">One JavaScript regular expression per line, tested against the full file path.</p>
  <p class="error" id="error" hidden></p>
  <fieldset>
    <legend>Matching files are</legend>
    <label><input type="radio" name="mode" value="collapse"> Collapsed, with the header still visible</label><br>
    <label><input type="radio" name="mode" value="hide"> Hidden from the diff and the file tree</label>
  </fieldset>
  <div class="actions">
    <button id="save" type="button">Save</button>
    <button id="reset" type="button">Restore defaults</button>
    <span id="status" role="status"></span>
  </div>
  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
